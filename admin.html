<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4movie Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --white: #fff;
      --gray: #888;
      --light: #f4f4f4;
      --border: #e0e0e0;
      --red: #d63031;
      --green: #00b894;
      --font: 'Space Mono', monospace;
    }

    body {
      background: var(--light);
      color: var(--black);
      font-family: var(--font);
      font-size: 13px;
      min-height: 100vh;
    }

    /* ─── LOGIN SCREEN ────────────────────────────────── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-box {
      background: var(--white);
      border: 1px solid var(--border);
      padding: 48px 40px;
      width: 100%;
      max-width: 360px;
    }

    .login-box h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .login-box p {
      font-size: 12px;
      color: var(--gray);
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 8px;
    }

    input[type=password], input[type=text] {
      width: 100%;
      font-family: var(--font);
      font-size: 13px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      background: var(--white);
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }

    input:focus { border-color: var(--black); }

    .btn {
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 12px 24px;
      border: 1px solid var(--black);
      background: var(--black);
      color: var(--white);
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }

    .btn:hover { background: #222; }

    .btn.secondary {
      background: none;
      color: var(--black);
    }

    .btn.secondary:hover { background: var(--light); }

    .btn.danger {
      background: none;
      color: var(--red);
      border-color: var(--red);
      width: auto;
      padding: 6px 14px;
      font-size: 10px;
    }

    .btn.danger:hover { background: var(--red); color: var(--white); }

    .login-error {
      font-size: 11px;
      color: var(--red);
      margin-top: 12px;
      display: none;
    }

    /* ─── ADMIN LAYOUT ────────────────────────────────── */
    #admin-screen { display: none; }

    .admin-header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .admin-header .logo {
      font-size: 14px;
      font-weight: 700;
    }

    .admin-header .logo span {
      font-weight: 400;
      color: var(--gray);
      font-size: 11px;
      margin-left: 10px;
      letter-spacing: 0.1em;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .header-actions .btn {
      width: auto;
      padding: 9px 20px;
    }

    .logout-btn {
      font-family: var(--font);
      font-size: 11px;
      color: var(--gray);
      background: none;
      border: none;
      cursor: pointer;
      letter-spacing: 0.1em;
      padding: 0;
      text-transform: uppercase;
    }

    .logout-btn:hover { color: var(--black); }

    /* ─── MAIN CONTENT ────────────────────────────────── */
    .admin-main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px;
    }

    /* ─── STATS BAR ───────────────────────────────────── */
    .stats-bar {
      display: flex;
      gap: 24px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--white);
      border: 1px solid var(--border);
      padding: 18px 24px;
      flex: 1;
      min-width: 140px;
    }

    .stat-val {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gray);
    }

    /* ─── UPLOAD ZONE ─────────────────────────────────── */
    .upload-section {
      background: var(--white);
      border: 1px solid var(--border);
      padding: 32px;
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .upload-controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 20px;
    }

    .field-group { display: flex; flex-direction: column; gap: 8px; }
    .field-group input, .field-group select {
      width: 100%;
      margin-bottom: 0;
    }

    select {
      font-family: var(--font);
      font-size: 13px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      background: var(--white);
      outline: none;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23888' stroke-width='1.5'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      transition: border-color 0.2s;
    }

    select:focus { border-color: var(--black); }

    .drop-zone {
      border: 2px dashed var(--border);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--black);
      background: #fafafa;
    }

    .drop-zone input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-zone p {
      font-size: 13px;
      color: var(--gray);
      line-height: 1.7;
    }

    .drop-zone strong {
      color: var(--black);
    }

    /* ─── PROGRESS ────────────────────────────────────── */
    .progress-bar-wrap {
      margin-top: 20px;
      display: none;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--gray);
      margin-bottom: 8px;
      letter-spacing: 0.1em;
    }

    .progress-bar {
      height: 3px;
      background: var(--border);
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--black);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* ─── TOAST ───────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background: var(--black);
      color: var(--white);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 14px 20px;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 999;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success { background: var(--green); }
    .toast.error   { background: var(--red);   }

    /* ─── PHOTO GRID ──────────────────────────────────── */
    .photos-section {
      background: var(--white);
      border: 1px solid var(--border);
      padding: 32px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .section-header .section-title { margin: 0; padding: 0; border: none; }

    .bulk-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .cat-filter-btns {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .cat-btn {
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 6px 14px;
      border: 1px solid var(--border);
      background: none;
      cursor: pointer;
      color: var(--gray);
      transition: all 0.2s;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    .admin-card {
      position: relative;
      border: 1px solid var(--border);
      background: var(--light);
      overflow: hidden;
    }

    .admin-card.selected {
      border-color: var(--black);
    }

    .admin-card img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
    }

    .admin-card .card-body {
      padding: 10px;
      border-top: 1px solid var(--border);
    }

    .admin-card .card-caption {
      font-family: var(--font);
      font-size: 11px;
      width: 100%;
      border: none;
      outline: none;
      background: none;
      color: var(--black);
      padding: 0;
      margin-bottom: 6px;
    }

    .admin-card .card-caption::placeholder { color: #bbb; }

    .admin-card .card-cat {
      font-family: var(--font);
      font-size: 10px;
      width: 100%;
      border: 1px solid var(--border);
      outline: none;
      background: var(--white);
      color: var(--gray);
      padding: 4px 8px;
      appearance: none;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .admin-card .card-actions {
      display: flex;
      gap: 6px;
      justify-content: space-between;
      align-items: center;
    }

    .card-select {
      width: 16px; height: 16px;
      cursor: pointer;
      accent-color: var(--black);
    }

    .save-btn {
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: 0.1em;
      padding: 5px 10px;
      background: var(--black);
      color: var(--white);
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .save-btn:hover { background: #333; }

    /* drag reorder */
    .admin-card { cursor: grab; }
    .admin-card.dragging { opacity: 0.4; cursor: grabbing; }
    .admin-card.drag-target { border: 2px dashed var(--black); }

    /* ─── EMPTY ───────────────────────────────────────── */
    .admin-empty {
      text-align: center;
      padding: 60px;
      color: var(--gray);
      font-size: 12px;
      line-height: 1.8;
    }

    /* ─── RESPONSIVE ──────────────────────────────────── */
    @media (max-width: 700px) {
      .admin-main { padding: 16px; }
      .upload-controls { grid-template-columns: 1fr; }
      .admin-grid { grid-template-columns: repeat(2, 1fr); }
      .stats-bar { gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- ─── LOGIN ─────────────────────────────────────── -->
  <div id="login-screen">
    <div class="login-box">
      <h1>4movie</h1>
      <p>Painel administrativo</p>
      <label>Senha</label>
      <input type="password" id="pwd-input" placeholder="••••••••"
             onkeydown="if(event.key==='Enter')tryLogin()">
      <button class="btn" onclick="tryLogin()">Entrar</button>
      <p class="login-error" id="login-err">Senha incorreta.</p>
    </div>
  </div>

  <!-- ─── ADMIN ─────────────────────────────────────── -->
  <div id="admin-screen">

    <div class="admin-header">
      <div class="logo">4MOVIE <span>Admin</span></div>
      <div class="header-actions">
        <a href="index.html" class="btn secondary" style="text-decoration:none;display:inline-block">Ver site ↗</a>
        <button class="logout-btn" onclick="logout()">Sair</button>
      </div>
    </div>

    <div class="admin-main">

      <!-- STATS -->
      <div class="stats-bar" id="stats-bar">
        <div class="stat">
          <div class="stat-val" id="stat-total">0</div>
          <div class="stat-label">Fotos total</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="stat-cerimonia">0</div>
          <div class="stat-label">Cerimônia</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="stat-reception">0</div>
          <div class="stat-label">Recepção</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="stat-detalhes">0</div>
          <div class="stat-label">Detalhes</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="stat-making">0</div>
          <div class="stat-label">Making Of</div>
        </div>
      </div>

      <!-- UPLOAD -->
      <div class="upload-section">
        <div class="section-title">Upload de fotos</div>

        <div class="upload-controls">
          <div class="field-group">
            <label>Categoria padrão das fotos</label>
            <select id="upload-cat">
              <option value="all">Sem categoria</option>
              <option value="cerimonia">Cerimônia</option>
              <option value="reception">Recepção</option>
              <option value="detalhes">Detalhes</option>
              <option value="making">Making Of</option>
            </select>
          </div>
          <div class="field-group">
            <label>Legenda padrão (opcional)</label>
            <input type="text" id="upload-caption" placeholder="Ex: Ana & Pedro">
          </div>
          <button class="btn" onclick="triggerUpload()">Selecionar fotos</button>
        </div>

        <div class="drop-zone" id="drop-zone">
          <input type="file" id="file-input" multiple accept="image/*"
                 onchange="handleFiles(this.files)">
          <p>
            <strong>Arraste as fotos aqui</strong><br>
            ou clique para selecionar<br>
            <span style="font-size:11px;color:#aaa;">JPG, PNG, WEBP · múltiplas de uma vez</span>
          </p>
        </div>

        <div class="progress-bar-wrap" id="progress-wrap">
          <div class="progress-info">
            <span id="progress-text">Processando...</span>
            <span id="progress-pct">0%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
      </div>

      <!-- PHOTOS -->
      <div class="photos-section">
        <div class="section-header">
          <div class="section-title">Fotos no site</div>
          <div class="bulk-actions">
            <button class="btn danger" id="delete-selected-btn"
                    style="display:none" onclick="deleteSelected()">
              Apagar selecionadas
            </button>
            <button class="btn danger" onclick="deleteAll()">Apagar todas</button>
          </div>
        </div>

        <div class="cat-filter-btns" id="admin-filters">
          <button class="cat-btn active" data-cat="all">Todas</button>
          <button class="cat-btn" data-cat="cerimonia">Cerimônia</button>
          <button class="cat-btn" data-cat="reception">Recepção</button>
          <button class="cat-btn" data-cat="detalhes">Detalhes</button>
          <button class="cat-btn" data-cat="making">Making Of</button>
        </div>

        <div class="admin-grid" id="admin-grid"></div>
      </div>

    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    // ══════════════════════════════════════════════════
    //  🔑  SENHA — mude aqui
    // ══════════════════════════════════════════════════
    const SENHA = '4movie2024';

    // ══════════════════════════════════════════════════
    //  DB
    // ══════════════════════════════════════════════════
    const DB_NAME = '4movie_db', STORE = 'photos', DB_VER = 1;
    let db;

    function openDB() {
      return new Promise((res, rej) => {
        const req = indexedDB.open(DB_NAME, DB_VER);
        req.onupgradeneeded = e => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains(STORE)) {
            const s = d.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
            s.createIndex('cat',   'cat',   { unique: false });
            s.createIndex('order', 'order', { unique: false });
          }
        };
        req.onsuccess = e => { db = e.target.result; res(db); };
        req.onerror   = e => rej(e);
      });
    }

    function getAllPhotos() {
      return new Promise((res, rej) => {
        const tx  = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => res(req.result.sort((a,b) => (a.order??0)-(b.order??0)));
        req.onerror   = e => rej(e);
      });
    }

    function savePhoto(photo) {
      return new Promise((res, rej) => {
        const tx  = db.transaction(STORE, 'readwrite');
        const req = tx.objectStore(STORE).put(photo);
        req.onsuccess = () => res(req.result);
        req.onerror   = e => rej(e);
      });
    }

    function deletePhoto(id) {
      return new Promise((res, rej) => {
        const tx  = db.transaction(STORE, 'readwrite');
        const req = tx.objectStore(STORE).delete(id);
        req.onsuccess = () => res();
        req.onerror   = e => rej(e);
      });
    }

    function clearAll() {
      return new Promise((res, rej) => {
        const tx  = db.transaction(STORE, 'readwrite');
        const req = tx.objectStore(STORE).clear();
        req.onsuccess = () => res();
        req.onerror   = e => rej(e);
      });
    }

    // ══════════════════════════════════════════════════
    //  AUTH
    // ══════════════════════════════════════════════════
    function tryLogin() {
      const v = document.getElementById('pwd-input').value;
      if (v === SENHA) {
        sessionStorage.setItem('4m_auth', '1');
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-screen').style.display = 'block';
        init();
      } else {
        document.getElementById('login-err').style.display = 'block';
        document.getElementById('pwd-input').focus();
      }
    }

    function logout() {
      sessionStorage.removeItem('4m_auth');
      location.reload();
    }

    // ══════════════════════════════════════════════════
    //  STATE
    // ══════════════════════════════════════════════════
    let allPhotos  = [];
    let filterCat  = 'all';
    let dragSrcId  = null;

    // ══════════════════════════════════════════════════
    //  UPLOAD
    // ══════════════════════════════════════════════════
    function triggerUpload() { document.getElementById('file-input').click(); }

    async function handleFiles(files) {
      if (!files.length) return;
      const cat     = document.getElementById('upload-cat').value;
      const caption = document.getElementById('upload-caption').value.trim();

      const wrap  = document.getElementById('progress-wrap');
      const fill  = document.getElementById('progress-fill');
      const txt   = document.getElementById('progress-text');
      const pct   = document.getElementById('progress-pct');
      wrap.style.display = 'block';

      const arr = [...files];
      let done  = 0;

      // find max order
      const maxOrder = allPhotos.length ? Math.max(...allPhotos.map(p => p.order ?? 0)) : 0;

      for (const file of arr) {
        try {
          const data = await toBase64(file);
          await savePhoto({
            data,
            cat:     cat,
            caption: caption || file.name.replace(/\.[^.]+$/, ''),
            order:   maxOrder + done + 1,
            added:   Date.now(),
          });
        } catch(e) {
          console.error(e);
        }
        done++;
        const p = Math.round((done / arr.length) * 100);
        fill.style.width = p + '%';
        pct.textContent  = p + '%';
        txt.textContent  = `Processando ${done} de ${arr.length}...`;
      }

      txt.textContent  = '✓ Concluído!';
      showToast(`${done} foto${done>1?'s':''} adicionada${done>1?'s':''}!`, 'success');

      setTimeout(() => { wrap.style.display = 'none'; fill.style.width = '0%'; }, 2000);

      document.getElementById('file-input').value = '';
      await refresh();
    }

    function toBase64(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload  = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
    }

    // ══════════════════════════════════════════════════
    //  DROP ZONE
    // ══════════════════════════════════════════════════
    const dz = document.getElementById('drop-zone');

    dz.addEventListener('dragover', e => {
      e.preventDefault();
      dz.classList.add('drag-over');
    });

    dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));

    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('drag-over');
      handleFiles(e.dataTransfer.files);
    });

    // ══════════════════════════════════════════════════
    //  RENDER
    // ══════════════════════════════════════════════════
    function renderAdmin(photos) {
      const grid = document.getElementById('admin-grid');
      grid.innerHTML = '';

      const visible = filterCat === 'all' ? photos : photos.filter(p => p.cat === filterCat);

      if (!visible.length) {
        grid.innerHTML = `<div class="admin-empty" style="grid-column:1/-1">Nenhuma foto aqui.</div>`;
        return;
      }

      visible.forEach(p => {
        const card = document.createElement('div');
        card.className = 'admin-card';
        card.dataset.id = p.id;
        card.draggable = true;

        card.innerHTML = `
          <img src="${p.data}" alt="">
          <div class="card-body">
            <input class="card-caption" type="text" value="${p.caption||''}" placeholder="Legenda...">
            <select class="card-cat">
              <option value="all"      ${p.cat==='all'      ?'selected':''}>Sem categoria</option>
              <option value="cerimonia"${p.cat==='cerimonia'?'selected':''}>Cerimônia</option>
              <option value="reception"${p.cat==='reception'?'selected':''}>Recepção</option>
              <option value="detalhes" ${p.cat==='detalhes' ?'selected':''}>Detalhes</option>
              <option value="making"   ${p.cat==='making'   ?'selected':''}>Making Of</option>
            </select>
            <div class="card-actions">
              <input type="checkbox" class="card-select" onchange="updateBulk()">
              <button class="save-btn" onclick="saveCard(${p.id}, this)">Salvar</button>
              <button class="btn danger" onclick="deleteSingle(${p.id})">✕</button>
            </div>
          </div>
        `;

        // drag reorder
        card.addEventListener('dragstart', () => {
          dragSrcId = p.id;
          card.classList.add('dragging');
        });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
        card.addEventListener('dragover', e => { e.preventDefault(); card.classList.add('drag-target'); });
        card.addEventListener('dragleave', () => card.classList.remove('drag-target'));
        card.addEventListener('drop', e => {
          e.preventDefault();
          card.classList.remove('drag-target');
          if (dragSrcId !== p.id) reorderPhotos(dragSrcId, p.id);
        });

        grid.appendChild(card);
      });
    }

    async function saveCard(id, btn) {
      const card    = btn.closest('.admin-card');
      const caption = card.querySelector('.card-caption').value.trim();
      const cat     = card.querySelector('.card-cat').value;
      const photo   = allPhotos.find(p => p.id === id);
      if (!photo) return;
      photo.caption = caption;
      photo.cat     = cat;
      await savePhoto(photo);
      showToast('Salvo!', 'success');
      await refresh();
    }

    async function deleteSingle(id) {
      if (!confirm('Apagar esta foto?')) return;
      await deletePhoto(id);
      showToast('Foto removida.', 'success');
      await refresh();
    }

    async function deleteSelected() {
      const ids = [...document.querySelectorAll('.card-select:checked')]
        .map(cb => parseInt(cb.closest('.admin-card').dataset.id));
      if (!ids.length) return;
      if (!confirm(`Apagar ${ids.length} foto${ids.length>1?'s':''}?`)) return;
      for (const id of ids) await deletePhoto(id);
      showToast(`${ids.length} foto${ids.length>1?'s':''} removida${ids.length>1?'s':''}.`, 'success');
      await refresh();
    }

    async function deleteAll() {
      if (!confirm('Apagar TODAS as fotos? Isso não tem volta.')) return;
      await clearAll();
      showToast('Todas as fotos foram removidas.', 'success');
      await refresh();
    }

    function updateBulk() {
      const count = document.querySelectorAll('.card-select:checked').length;
      const btn   = document.getElementById('delete-selected-btn');
      btn.style.display = count > 0 ? 'inline-block' : 'none';
      btn.textContent   = `Apagar selecionadas (${count})`;
    }

    // ══════════════════════════════════════════════════
    //  REORDER (drag & drop)
    // ══════════════════════════════════════════════════
    async function reorderPhotos(srcId, tgtId) {
      const src = allPhotos.findIndex(p => p.id === srcId);
      const tgt = allPhotos.findIndex(p => p.id === tgtId);
      if (src < 0 || tgt < 0) return;

      const moved = allPhotos.splice(src, 1)[0];
      allPhotos.splice(tgt, 0, moved);

      // re-assign order
      for (let i = 0; i < allPhotos.length; i++) {
        allPhotos[i].order = i;
        await savePhoto(allPhotos[i]);
      }

      renderAdmin(allPhotos);
      showToast('Ordem salva!', 'success');
    }

    // ══════════════════════════════════════════════════
    //  STATS
    // ══════════════════════════════════════════════════
    function updateStats(photos) {
      document.getElementById('stat-total').textContent     = photos.length;
      document.getElementById('stat-cerimonia').textContent = photos.filter(p=>p.cat==='cerimonia').length;
      document.getElementById('stat-reception').textContent = photos.filter(p=>p.cat==='reception').length;
      document.getElementById('stat-detalhes').textContent  = photos.filter(p=>p.cat==='detalhes').length;
      document.getElementById('stat-making').textContent    = photos.filter(p=>p.cat==='making').length;
    }

    // ══════════════════════════════════════════════════
    //  REFRESH
    // ══════════════════════════════════════════════════
    async function refresh() {
      allPhotos = await getAllPhotos();
      renderAdmin(allPhotos);
      updateStats(allPhotos);
    }

    // ══════════════════════════════════════════════════
    //  FILTER
    // ══════════════════════════════════════════════════
    document.getElementById('admin-filters').addEventListener('click', e => {
      if (!e.target.classList.contains('cat-btn')) return;
      filterCat = e.target.dataset.cat;
      document.querySelectorAll('.cat-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.cat === filterCat));
      renderAdmin(allPhotos);
    });

    // ══════════════════════════════════════════════════
    //  TOAST
    // ══════════════════════════════════════════════════
    let toastTimer;

    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent  = msg;
      t.className    = 'toast show ' + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = 'toast'; }, 2800);
    }

    // ══════════════════════════════════════════════════
    //  BOOT
    // ══════════════════════════════════════════════════
    async function init() {
      await openDB();
      await refresh();
    }

    // auto-login se já tem sessão
    if (sessionStorage.getItem('4m_auth') === '1') {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'block';
      init();
    }

    document.getElementById('pwd-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') tryLogin();
    });
  </script>
</body>
</html>
